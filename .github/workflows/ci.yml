name: Runtime Nomad Conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gc_ref:
        description: >-
          gc git ref to install for this run. Override only to test a candidate
          ref; a normal run uses the per-cut default on GC_REF below.
        required: false
        type: string
        default: "6ba434271c5f76bc150f694ebeef9d713be16b3a"

permissions:
  contents: read

# The gc this gate runs against is pinned, never "latest". `cmd/gc@latest` let
# upstream drift flip this workflow red or green independently of the gc the
# release was proven against -- upstream main sat 31 commits past the pin base
# as of 2026-09-09. UPDATE THIS VALUE PER CUT to the gc the release is proven
# against.
#
# The value is the upstream base of the maintainer's private pin lineage (the
# `6ba434271 (upstream base)` entry of the pin line in docs/PIN-DEPENDENCIES.md),
# not the pin commit itself: the live pin is a private-lineage commit (dc1a8851e,
# recorded in the maintainer's own pin-swap receipt) that does not exist on
# gastownhall/gascity, so `go install .../cmd/gc@<pin-sha>` cannot resolve on any
# runner -- hosted or self-hosted. The consequence is stated rather than papered
# over: this workflow is the deterministic upstream-base gate, and the at-pin
# conformance evidence a release needs is a run against the pinned gc inside a
# real allocation. A green run here is not at-pin evidence.
env:
  GC_REF: 6ba434271c5f76bc150f694ebeef9d713be16b3a

jobs:
  receipt:
    name: Phase-1 conformance receipt (full offline ladder)
    # Self-hosted labels come from a repository variable so this file names no
    # private machine, and so a FORK works without editing CI. A fork has no
    # CI_RUNNER_LABELS set, falls through to ubuntu-latest, and its first push
    # gets a real run instead of a job queued forever against a runner that
    # does not exist for it.
    #
    # ubuntu-latest is not a degraded path here: this job is the OFFLINE
    # conformance ladder, and the pull_request leg has always run it on
    # ubuntu-latest. Nothing in it needs the self-hosted host.
    #
    # To use your own runner: set the repository variable CI_RUNNER_LABELS to a
    # JSON array, e.g. ["self-hosted","linux","my-label"].
    runs-on: ${{ (github.event_name == 'push' && vars.CI_RUNNER_LABELS != '') && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: runtime/go.mod

      - name: Install Gas City
        env:
          # Empty on push/PR; only a workflow_dispatch run sets it.
          DISPATCH_GC_REF: ${{ inputs.gc_ref }}
        run: |
          set -euo pipefail
          GC_REF="${DISPATCH_GC_REF:-$GC_REF}"
          echo "Installing gc@${GC_REF}"
          go install github.com/gastownhall/gascity/cmd/gc@"${GC_REF}"
          # Informational provenance: name the gc the ladder is about to run.
          "$(go env GOPATH)/bin/gc" version || true

      - name: Run the phase-1 conformance suite
        run: GC_BIN="$(go env GOPATH)/bin/gc" ./conformance.sh

      # The suite above is green against a gc carrying NONE of the pin
      # families -- which is the honest state of this workflow and also its
      # blind spot: a green run cannot see the pack's own primary dependency
      # failing. This leg is the inverse assertion, and it is the only place
      # CI observes that dependency at all.
      #
      # The pack refuses to mint a box on a gc that cannot claim work from
      # inside an allocation. GC_REF here IS such a gc, so `check` MUST exit
      # nonzero. If it starts passing, either the gate regressed or the ref
      # gained the family -- both are things this workflow should stop and
      # say rather than sail past.
      - name: Assert the pack refuses a gc without the remote-worker family
        env:
          DISPATCH_GC_REF: ${{ inputs.gc_ref }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_GC_REF:-}" ]; then
            echo "workflow_dispatch supplied gc_ref=${DISPATCH_GC_REF}; this leg"
            echo "asserts the refusal only for the default upstream-base ref."
            exit 0
          fi
          export PATH="$(go env GOPATH)/bin:$PATH"
          ( cd runtime && go build -o "${RUNNER_TEMP}/gc-runtime-nomad" . )
          if "${RUNNER_TEMP}/gc-runtime-nomad" check; then
            echo "::error::gc-runtime-nomad check PASSED against gc@${GC_REF}," \
                 "the upstream base carrying none of the pin families. Either the" \
                 "capability gate regressed, or that ref now carries" \
                 "remote-worker-lifecycle. See docs/PIN-DEPENDENCIES.md."
            exit 1
          fi
          echo "ok: the pack refuses gc@${GC_REF}, as it must."

