# build ARG. Values are upstream-PUBLISHED checksums, never estate-internal
# ones; each one was re-verified against its publisher on 2026-09-09T03:4xZ
# (measurements, dates, and the two rejected pins: toolchain/BUILD-RECEIPT.md).
