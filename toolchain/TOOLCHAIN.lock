# toolchain/TOOLCHAIN.lock — checksum-pinned session toolchain build input
#
# Written by cr-u7b0s.45 (Remediate G: package the box toolchain as a
# checksum-pinned prebaked image). Consumed by toolchain/Dockerfile through
# toolchain/build-image.sh, which reads every value below and passes it as a
# build ARG. The component lines below are upstream-PUBLISHED checksums, each
# one re-verified against its publisher on 2026-09-09T03:4xZ (measurements,
# dates, and the two rejected pins: toolchain/BUILD-RECEIPT.md). The single
# exception is `gc_local_artifact` — the estate's own built pin, which has
# no publisher, verified instead against its staged bytes and the gc commit
# it reports (cr-dk9i2, below).
#
# This file is the layout+checksum assertion that README §"Worked example —
# Codex" demands of any toolchain staging receipt: the artifact, its sha256,
# and the layout it asserts — for the whole session toolchain, not one binary.
#
# It ships NO delivery layer: no host volume, no /mnt/nomad path, no
# [session.k8s] prebaked key, no second image knob. The image it describes is
# the single value GC_NOMAD_AGENT_IMAGE takes (seam owned by cr-u7b0s.41, which
# this atom does not rename), and publishing stays an executive host step —
# allocations never write /mnt/nomad/gc/bin (ruling cr-on8x4 on cr-gdeav.2.13).

# Base image, pinned by digest — never a floating tag. This is the digest
# upstream's own contrib/k8s/Dockerfile.base:13,:103 builds its system-package
# layer on; an atom that omits it gets gc build-image's default `gc-agent:latest`.
base_image ubuntu:24.04@sha256:c4a8d5503dfb2a3eb8ab5f807da5bc69a85730fb49b5cfca2330194ebcc41c7b

# The builder that rebuilds bd (upstream's own digest, contrib/k8s/Dockerfile.agent:22).
build_image golang:1.26.6-bookworm@sha256:433f9dc4f8ea3a1ce4e28f9f15d0f7c056b10475307f886d6f1ac1ccc4abd976

# The ONE image reference the pack consumes. build-image.sh prints the value to
# export as GC_NOMAD_AGENT_IMAGE; it is never pushed (registry publication is a
# later owner decision — AGENTS.md hard stop).
#
# 1.0.7 (cr-3vvnb5.6): the ONE reference is the estate's own built tag, named
# for the gc pin it carries. It is a plain local docker tag on the host that runs
# the docker driver — NOT a registry reference; the local registry was retired as
# the delivery path in favour of this native knob (owner ruling 2026-09-11,
# ops/receipts/nrt-d3/2026-09-11-registry-retired-for-the-native-knob.md). This is
# the exact value the fresh-leg proof started its session with and reached the
# prompt on (proof: cr-3vvnb5.6, 2026-09-11T04:2xZ).
agent_image gc-agent:b55e229e1

# Rollback: build-image.sh re-tags whatever was live to this tag BEFORE it
# builds, and records that image id in the deployment receipt. Rolling back is
# pointing GC_NOMAD_AGENT_IMAGE back at this tag, or at any earlier tag the
# receipt names — a previous IMAGE TAG is the only rollback there is. Unsetting
# it is not a rollback: the Docker task is the only session shape and every
# lifecycle op fails closed without an image (cr-3vvnb5.2), and the legacy exec
# + read-only artifact-volume shape this used to fall back to is deleted
# (cr-3vvnb5).
#
# 1.0.7 HAS NO ROLLBACK ARTIFACT, and the release notes say so plainly rather
# than manufacture a tag. Every image built before image durability landed was
# reaped by Nomad's docker image GC (measured on the docker host at release time:
# one gc image present, gc-agent:b55e229e1, id sha256:3e49e2d23b0e). There is no
# previous release to fall back to, and an older engine image under this pack is
# a combination that has never existed. 1.0.7 IS the baseline; the next
# build-image.sh run fills this tag honestly from the image that was live.
rollback_image gc-session-toolchain:rollback

# --- components ------------------------------------------------------------
# Each line: <name> <version> sha256:<published digest> artifact=… url=…
# layout=… provenance=…  (`sha256sum --check --strict` is the assertion form.)

gc 1.4.1 sha256:8d8c8b511db3fc44931445aab5cb9f212509c0867105c880d6c3d0e6e5d33e42 artifact=gascity_1.4.1_linux_amd64.tar.gz url=https://github.com/gastownhall/gascity/releases/download/v1.4.1/gascity_1.4.1_linux_amd64.tar.gz layout=/usr/local/bin/gc asserts=gc version -> v1.4.1 commit 58ef17e3bd685fd5cf7f21286277b208d3324590, embedded grpc v1.82.1 provenance=https://github.com/gastownhall/gascity/releases/download/v1.4.1/gascity_1.4.1_checksums.txt
# --- the LIVE pin (cr-dk9i2) -------------------------------------------------
# The gc line above is the upstream-PUBLISHED release and stays the PUBLIC
# DEFAULT — it is what a stranger to this estate gets, and `build --published`
# still builds exactly it. It is NOT what the estate runs: the live pin is newer
# (measured 2026-09-09T14:2xZ, `gc version --json --long` ->
# {"commit":"e52f96f62","version":"dev"}), so an image assembled only from
# published release bytes ships a gc OLDER than the pin it exists to carry.
# build-image.sh prefers the line below when it is named, refuses (never falls
# back) when it is named but missing or mismatched, and `--published` is the
# deliberate way back to upstream.
#
# This is a BUILD-HOST path read at docker-build time and copied INTO the image,
# not a runtime delivery layer: the image still mounts nothing, no
# [session.k8s] key appears, and no allocation writes /mnt/nomad/gc/bin — the
# ruling the header records (cr-on8x4) is untouched. Refresh it in one command
# ON THE HOST THAT STAGES THE PIN (a Mac's live pin is a darwin build):
#   toolchain/build-image.sh refresh-pin --artifact=/mnt/nomad/gc/bin/<pin>/gc
gc_local_artifact /mnt/nomad/gc/bin/e52f96f62/gc sha256=0f3b9e3a3e115ba95096ce9ea01e08d4f97b397243ddca0ec259de6e0c2b25a7 pin=e52f96f62 asserts=gc version --json --long -> commit == pin
